<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIRIAI — Campaign Content Guides</title>
  <meta name="description" content="SIRIAI 인플루언서 콘텐츠 가이드 모음.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue:#2740d6; --white:#fff; --bg:#f7f6f5; --ink:#1c1b1a; --ink-mid:#57544e; --ink-light:#9a968c; --border:#e5e3de;
      --fd:'Instrument Sans','Noto Sans KR',sans-serif; --fb:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
      --ease:cubic-bezier(0.4,0,0.2,1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--fb);background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;min-height:100vh;}
    .wrap{max-width:560px;margin:0 auto;padding:0 20px;}
    .top{border-bottom:1px solid var(--border);}
    .top .wrap{display:flex;align-items:center;justify-content:space-between;height:54px;}
    .brand{font-family:var(--fd);font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
    .brand span{color:var(--blue);}
    .badge{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mid);}
    .hero{padding:56px 0 34px;}
    .eyebrow{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
    .eyebrow::before{content:'';width:22px;height:1px;background:currentColor;opacity:.6;}
    h1{font-size:30px;font-weight:700;line-height:1.3;letter-spacing:-.02em;}
    .sub{margin-top:14px;color:var(--ink-mid);font-size:14.5px;line-height:1.7;}
    .list{padding-bottom:60px;display:flex;flex-direction:column;gap:12px;}
    .card{display:block;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--white);transition:box-shadow .25s var(--ease),transform .25s var(--ease);}
    .card:hover{box-shadow:0 8px 30px rgba(20,19,17,.1);transform:translateY(-2px);}
    .card-img{position:relative;aspect-ratio:16/10;background:var(--bg);overflow:hidden;}
    .card-img img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}
    .card-tag{position:absolute;top:12px;left:12px;font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(20,19,17,.72);backdrop-filter:blur(4px);color:#fff;border-radius:999px;padding:6px 12px;}
    .card-body{padding:18px 18px 20px;}
    .card-title{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.35;}
    .card-desc{margin-top:8px;color:var(--ink-mid);font-size:13.5px;line-height:1.65;}
    .card-go{margin-top:14px;font-family:var(--fd);font-size:12.5px;font-weight:600;color:var(--blue);display:inline-flex;align-items:center;gap:6px;}
    .soon{opacity:.5;pointer-events:none;}
    .soon .card-go{color:var(--ink-light);}
    .foot{border-top:1px solid var(--border);background:var(--bg);}
    .foot .wrap{padding:32px 20px;}
    .foot b{font-family:var(--fd);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
    .foot p{margin-top:8px;font-size:12px;color:var(--ink-light);line-height:1.7;}
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><div class="brand">SIRIAI<span> · </span>GUIDES</div><div class="badge">Campaign Content</div></div></header>

  <section class="hero"><div class="wrap">
    <p class="eyebrow">Content Guidelines</p>
    <h1>캠페인 콘텐츠 가이드</h1>
    <p class="sub">인플루언서 협업 콘텐츠 제작을 위한 SIRIAI 가이드 모음입니다.</p>
  </div></section>

  <section class="list"><div class="wrap" style="display:flex;flex-direction:column;gap:12px;">
    <a class="card" href="jennie-europe/">
      <div class="card-img"><img src="jennie-europe/assets/images/therow-1.jpg" alt="제니 유럽 사복"><span class="card-tag">Blog · Fashion</span></div>
      <div class="card-body">
        <div class="card-title">제니 유럽 사복 · 젠민수 아이템</div>
        <div class="card-desc">코펜하겐·로스킬레·오프너 유럽 일정 사복 아카이브 블로그 가이드.</div>
        <span class="card-go">가이드 열기 →</span>
      </div>
    </a>
  </div></section>

  <footer class="foot"><div class="wrap"><b>SIRIAI</b><p>인플루언서 마케팅 · 콘텐츠 가이드라인<br>본 저장소의 문서는 협업 콘텐츠 제작용 내부 참고 자료입니다.</p></div></footer>
</body>
</html>
